<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Post-Install Helper</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 1.5vh 1.5vw;
        }

        /* Top Bar z eksportem */
        header {
            height: 6vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #29292e;
            padding-bottom: 0.5vh;
        }

        header h1 { font-size: 2.8vh; color: #04d361; }
        
        .btn-export {
            background: #202024;
            border: 1px solid #04d361;
            color: #04d361;
            padding: 0.6vh 1vw;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.6vh;
            transition: 0.2s;
        }
        .btn-export:hover { background: #04d361; color: #121214; }

        /* Kontener na sekcje z wewnętrznym scrollem */
        #workspace {
            height: 92vh;
            overflow-y: auto;
            margin-top: 1.5vh;
            padding-right: 0.5vw;
        }

        /* Sekcja kategorii */
        .section-container {
            background: #1c1c1f;
            border-radius: 6px;
            padding: 1.5vh 1vw;
            margin-bottom: 2vh;
            border: 1px solid #29292e;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5vh;
            border-bottom: 1px solid #323238;
            padding-bottom: 0.5vh;
        }

        .section-title { font-size: 2.2vh; color: #a8a8b3; font-weight: 600; }
        
        .btn-delete-section {
            background: transparent;
            border: none;
            color: #f75a68;
            cursor: pointer;
            font-size: 1.5vh;
        }

        /* Siatka kafelków */
        .grid-apps {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(14%, 1fr));
            grid-auto-rows: 9vh;
            gap: 1.5vh 1vw;
        }

        /* Główny Kafelek */
        .app-card {
            background: #202024;
            border: 1px solid #323238;
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 0 6%;
            position: relative;
            transition: border-color 0.2s;
        }
        .app-card:hover { border-color: #04d361; }

        .app-icon {
            width: 22%;
            height: 55%;
            margin-right: 8%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-icon img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .app-info {
            width: 70%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.4vh;
        }

        .app-name {
            font-size: 1.7vh;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Selektor wariantów wewnątrz kafelka */
        .app-select-container {
            display: flex;
            width: 100%;
            gap: 4%;
        }

        .app-select {
            width: 75%;
            background: #121214;
            color: #e1e1e6;
            border: 1px solid #323238;
            border-radius: 3px;
            font-size: 1.3vh;
            padding: 0.2vh;
            outline: none;
        }

        .btn-download {
            width: 21%;
            background: #04d361;
            border: none;
            border-radius: 3px;
            color: #121214;
            font-weight: bold;
            font-size: 1.4vh;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-download:hover { background: #00b34d; }

        /* Przyciski Akcji (Dodaj program / Dodaj sekcję) */
        .card-add {
            border: 1px dashed #323238;
            background: transparent;
            justify-content: center;
            align-items: center;
            color: #8d8d99;
            font-size: 1.6vh;
            cursor: pointer;
        }
        .card-add:hover { border-color: #04d361; color: #04d361; }

        .btn-add-section {
            width: 100%;
            background: #202024;
            border: 1px dashed #04d361;
            color: #04d361;
            padding: 1.5vh;
            border-radius: 6px;
            font-size: 1.8vh;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 3vh;
        }
        .btn-add-section:hover { background: #1c1c1f; }

        /* Własne Menu Kontekstowe (Prawy Przycisk) */
        #context-menu {
            position: absolute;
            background: #29292e;
            border: 1px solid #4d4d57;
            border-radius: 4px;
            display: none;
            z-index: 1000;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }

        #context-menu div {
            padding: 1vh 1.5vw;
            font-size: 1.5vh;
            cursor: pointer;
            color: #e1e1e6;
        }
        #context-menu div:hover { background: #04d361; color: #121214; }
    </style>
</head>
<body>

    <header>
        <h1>Windows Post-Install Helper</h1>
        <button class="btn-export" onclick="exportConfig()">⬇️ Pobierz plik config.json</button>
    </header>

    <div id="workspace">
        <!-- Generowane dynamicznie -->
    </div>

    <!-- Menu pod prawym przyciskiem myszy -->
    <div id="context-menu">
        <div onclick="contextEditApp()">✏️ Edytuj program</div>
        <div onclick="contextDeleteApp()" style="color: #f75a68;">❌ Usuń program</div>
    </div>

    <script>
        let configData = [];
        let currentTargetApp = null;

        const workspace = document.getElementById('workspace');
        const contextMenu = document.getElementById('context-menu');

        async function init() {
            try {
                const response = await fetch('config.json');
                configData = await response.json();
            } catch (e) {
                console.log("Brak pliku config.json lub uruchomiono bez serwera. Ładowanie demo.");
                configData = [
                    {
                        "section": "Przeglądarki",
                        "apps": [
                            {
                                "name": "Chrome",
                                "iconUrl": "https://cdn-icons-png.flaticon.com/512/888/888846.png",
                                "variants": [
                                    {"label": "Chrome PL", "url": "https://google.pl"},
                                    {"label": "Chrome EN", "url": "https://google.com"}
                                ]
                            }
                        ]
                    }
                ];
            }
            renderWorkspace();
        }

        function renderWorkspace() {
            workspace.innerHTML = '';

            configData.forEach((sec, secIdx) => {
                const secEl = document.createElement('div');
                secEl.className = 'section-container';

                secEl.innerHTML = `
                    <div class="section-header">
                        <span class="section-title">${sec.section}</span>
                        <button class="btn-delete-section" onclick="deleteSection(${secIdx})">Usuń sekcję</button>
                    </div>
                    <div class="grid-apps" id="grid-sec-${secIdx}"></div>
                `;
                workspace.appendChild(secEl);

                const grid = document.getElementById(`grid-sec-${secIdx}`);

                sec.apps.forEach((app, appIdx) => {
                    const card = document.createElement('div');
                    card.className = 'app-card';
                    
                    card.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        currentTargetApp = { secIdx, appIdx };
                        contextMenu.style.top = `${e.pageY}px`;
                        contextMenu.style.left = `${e.pageX}px`;
                        contextMenu.style.display = 'block';
                    });

                    let optionsHtml = app.variants.map((v, vIdx) => `<option value="${v.url}">${v.label}</option>`).join('');
                    optionsHtml += `<option value="__ADD_NEW__">+ Dodaj wersję</option>`;

                    card.innerHTML = `
                        <div class="app-icon">
                            <img src="${app.iconUrl}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135682.png'">
                        </div>
                        <div class="app-info">
                            <div class="app-name" title="${app.name}">${app.name}</div>
                            <div class="app-select-container">
                                <select class="app-select" onchange="handleSelectChange(this, ${secIdx}, ${appIdx})">
                                    ${optionsHtml}
                                </select>
                                <button class="btn-download" onclick="downloadApp(this)">💾</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                const addAppCard = document.createElement('div');
                addAppCard.className = 'app-card card-add';
                addAppCard.innerText = '+ Dodaj program';
                addAppCard.onclick = () => addApp(secIdx);
                grid.appendChild(addAppCard);
            });

            const addSecBtn = document.createElement('button');
            addSecBtn.className = 'btn-add-section';
            addSecBtn.innerText = '+ Dodaj nową sekcję';
            addSecBtn.onclick = addSection;
            workspace.appendChild(addSecBtn);
        }

        function handleSelectChange(selectEl, secIdx, appIdx) {
            if (selectEl.value === '__ADD_NEW__') {
                const label = prompt("Wpisz nazwę wariantu (np. NVIDIA RTX 50 Series lub Chrome NL):");
                if (!label) { selectEl.selectedIndex = 0; return; }
                const url = prompt("Podaj adres URL lub ścieżkę lokalną pliku:");
                if (!url) { selectEl.selectedIndex = 0; return; }

                configData[secIdx].apps[appIdx].variants.push({ label, url });
                renderWorkspace();
            }
        }

        document.addEventListener('contextmenu', function(e) {
            if (!e.target.closest('.app-card')) {
                contextMenu.style.display = 'none';
            }
        });

        function downloadApp(btnEl) {
            const select = btnEl.previousElementSibling;
            if(select.value && select.value !== '__ADD_NEW__') {
                window.open(select.value, '_blank');
            }
        }

        function addSection() {
            const name = prompt("Podaj nazwę nowej sekcji:");
            if (name) {
                configData.push({ section: name, apps: [] });
                renderWorkspace();
            }
        }

        function deleteSection(secIdx) {
            if (confirm("Czy na pewno chcesz usunąć tę sekcję wraz ze wszystkimi programami?")) {
                configData.splice(secIdx, 1);
                renderWorkspace();
            }
        }

        function addApp(secIdx) {
            const name = prompt("Nazwa programu:");
            if (!name) return;
            const iconUrl = prompt("Link do ikony (lub lokalna ścieżka np. ./img/icon.png):") || "";
            const vLabel = prompt("Nazwa pierwszej wersji (np. Wersja PL lub Standard):") || "Domyślna";
            const vUrl = prompt("Link/ścieżka do pobrania pliku:") || "#";

            configData[secIdx].apps.push({
                name,
                iconUrl,
                variants: [{ label: vLabel, url: vUrl }]
            });
            renderWorkspace();
        }

        function contextEditApp() {
            if (!currentTargetApp) return;
            const app = configData[currentTargetApp.secIdx].apps[currentTargetApp.appIdx];
            
            const newName = prompt("Zmień nazwę programu:", app.name);
            if (newName) app.name = newName;
            
            const newIcon = prompt("Zmień link do ikony:", app.iconUrl);
            if (newIcon !== null) app.iconUrl = newIcon;

            renderWorkspace();
        }

        function contextDeleteApp() {
            if (!currentTargetApp) return;
            if (confirm("Usunąć ten program?")) {
                configData[currentTargetApp.secIdx].apps.splice(currentTargetApp.appIdx, 1);
                renderWorkspace();
            }
        }

        window.addEventListener('click', () => { contextMenu.style.display = 'none'; });

        function exportConfig() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(configData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "config.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
